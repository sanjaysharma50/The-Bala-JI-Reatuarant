{% extends "restaurant/base.html" %}

{% block title %}
Register | The-Bala-JI Restaurant
{% endblock %}


{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <span class="eyebrow">
            JOIN US
        </span>

        <h1>Create Account</h1>

        <p>
            Create your account for a better experience.
        </p>


        <form method="POST">

            {% csrf_token %}

            <label>Username</label>

            <input
                type="text"
                name="username"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >


            <label>Confirm Password</label>

            <input
                type="password"
                name="confirm_password"
                required
            >


            <button
                type="submit"
                class="btn full-btn"
            >
                Create Account
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </p>

    </div>

</section>

{% endblock %}
